    </g>
    <rect x="260" y="1565" width="150" height="25" rx="4" fill="#28543a"/>
    <text x="335" y="1582" text-anchor="middle" font-size="13" fill="white">Send Message</text>
    <text x="155" y="1630" font-size="16">My Design — link to this wireframe</text>
    <rect x="130" y="1650" width="640" height="70" rx="8" fill="#263f30"/>
    <text x="450" y="1678" text-anchor="middle" font-size="15" fill="white">Created by SK</text>
    <text x="450" y="1703" text-anchor="middle" font-size="15" fill="white">© 2026 Small Things</text>
