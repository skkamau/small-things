<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1750" viewBox="0 0 900 1750" role="img" aria-labelledby="title description">
  <title id="title">Small Things website wireframe</title>
  <desc id="description">A single-column layout with introduction, website description, six favorite photographs, photographer biography, categories, photo table, contact form, design link, and footer.</desc>
  <rect width="900" height="1750" fill="#f7f3ec"/>
  <g font-family="Arial, sans-serif" fill="#333333">
    <text x="450" y="45" font-size="26" text-anchor="middle">Small Things — Page Design</text>
    <text x="450" y="72" font-size="14" text-anchor="middle">Single-column layout • centered content • flexible width</text>
    <g fill="white" stroke="#b7c4b2" stroke-width="2">
      <rect x="130" y="100" width="640" height="130" rx="8"/>
      <rect x="130" y="250" width="640" height="100" rx="8"/>
      <rect x="130" y="370" width="640" height="530" rx="8"/>
      <rect x="130" y="920" width="640" height="140" rx="8"/>
      <rect x="130" y="1080" width="640" height="110" rx="8"/>
      <rect x="130" y="1210" width="640" height="140" rx="8"/>
      <rect x="130" y="1370" width="640" height="230" rx="8"/>
    </g>
    <g font-size="20" fill="#28543a">
      <text x="450" y="140" text-anchor="middle">Small Things</text>
      <text x="155" y="280">About This Website</text>
      <text x="155" y="402">My Favorite Photos</text>
      <text x="155" y="950">About the Photographer</text>
      <text x="155" y="1110">Types of Photos I Like</text>
      <text x="155" y="1240">Photo Information</text>
      <text x="155" y="1400">Contact Me</text>
    </g>
    <g font-size="14">
      <text x="450" y="177" text-anchor="middle">Introductory paragraph</text>
      <text x="450" y="205" text-anchor="middle">Emphasized photography quote</text>
      <text x="155" y="315">Short description and a strong statement</text>
      <text x="155" y="990">SK — student and photographer</text>
      <text x="155" y="1020">Short biography and photography interests</text>
      <text x="155" y="1143">• Nature • Street • Portraits</text>
      <text x="155" y="1170">• Sunsets • Everyday moments</text>
      <text x="155" y="1273">Photo                         Year                         Type</text>
      <text x="155" y="1303">Rows of photograph details</text>
      <text x="155" y="1330">Full-width table with borders</text>
      <text x="155" y="1435">Name</text>
      <text x="155" y="1485">Email</text>
      <text x="155" y="1535">Message</text>
    </g>
    <g fill="#e8e8e2" stroke="#b7c4b2">
      <rect x="155" y="420" width="210" height="55" rx="4"/>
      <rect x="155" y="495" width="210" height="55" rx="4"/>
      <rect x="155" y="570" width="210" height="55" rx="4"/>
      <rect x="155" y="645" width="210" height="55" rx="4"/>
      <rect x="155" y="720" width="210" height="55" rx="4"/>
      <rect x="155" y="795" width="210" height="55" rx="4"/>
      <rect x="260" y="1415" width="340" height="30" rx="4"/>
      <rect x="260" y="1465" width="340" height="30" rx="4"/>
      <rect x="260" y="1515" width="340" height="40" rx="4"/>
    </g>
    <g font-size="15">
      <text x="390" y="453">1. Window Light</text>
      <text x="390" y="528">2. Rain on the Glass</text>
      <text x="390" y="603">3. The Long Way Home</text>
      <text x="390" y="678">4. Market at Noon</text>
      <text x="390" y="753">5. Steady Hands</text>
      <text x="390" y="828">6. Last Light</text>
